name: Build

# Packages the jars. The tests run in the Test workflow; a branch protection rule requires them to pass
# before a pull request is merged, so they are not run again here.
on:
  pull_request:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      # The jars stay Java 17 bytecode (maven.compiler.release) whatever the JDK that builds them.
      - name: Package with Maven
        run: mvn -B install -DskipTests -Djacoco.skip=true --file pom.xml
      - run: |
          mkdir staging
          cp sms-authenticator/target/*.jar staging
          cp email-authenticator/target/*.jar staging
          cp app-authenticator/target/*.jar staging
          cp enforce-mfa/target/*.jar staging
          cp trusted-device-authenticator/target/*.jar staging
      - name: Create hash files
        run: |
          for jar in *.jar
          do
              sha512sum $jar | awk '{ print $1 }' > "${jar}.sha512"
          done
        working-directory: staging
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: staging
